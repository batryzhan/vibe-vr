# What this cluster differs from production in, and nothing else: the base's ConfigMap is the one
# being exercised, so every value it does not name here is the deployed one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nap-config
  namespace: nap
data:
  # This cluster is reached through localhost, and the auth cookie and CORS both compare these
  # verbatim.
  VIBE_VR_API_URL: "http://localhost:8080"
  VIBE_VR_WEB_ORIGIN: "http://localhost:3000"
  # Shorter than production's ten minutes: the proof restarts the workers on purpose, and waiting
  # the real drain out would make the run fifteen minutes long. The relationship the base's test
  # asserts — a grace period comfortably past the drain — is only widened by this.
  VIBE_VR_DRAIN_TIMEOUT_SECONDS: "30"
